# Job de setup do artigo 09 (OBT): cria os catálogos a09_bronze_<amb>, a09_silver_<amb> e
# a09_gold_<amb> (o ambiente vem do target do bundle: dev → _dev, prod → _prd), com um schema por
# sistema da fatia e o Volume landing no Bronze, e grava a carga inicial da fatia nas landings.
#
#   databricks bundle run 09_setup -p <seu-perfil>
#   databricks bundle run 09_setup -p <seu-perfil> --params escala=0.1,reset=true

resources:
  jobs:
    09_setup:
      name: 09_setup
      parameters:
        - name: escala
          default: "1"
        - name: reset
          default: "false"
      tasks:
        - task_key: gerar_fatia
          environment_key: gerador
          python_wheel_task:
            package_name: modelbricks_gerador
            entry_point: gerar_fatia
            parameters:
              - "--artigo=09-obt"
              - "--escala={{job.parameters.escala}}"
              - "--reset={{job.parameters.reset}}"
              - "--ambiente=${var.ambiente}"
      # Sem cluster declarado: o job roda em compute serverless (o único do Free Edition).
      environments:
        - environment_key: gerador
          spec:
            environment_version: "6"
            dependencies:
              - ../../00-gerador/dist/*.whl
