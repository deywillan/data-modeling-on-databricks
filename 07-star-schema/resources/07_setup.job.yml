# Job de setup do artigo 07 (Star Schema): cria o catálogo medalhao_07_star_schema, os schemas landing (com
# Volume), bronze, silver e gold, e grava a carga inicial da fatia na landing.
#
#   databricks bundle run 07_setup -p <seu-perfil>
#   databricks bundle run 07_setup -p <seu-perfil> --params escala=0.1,reset=true

resources:
  jobs:
    07_setup:
      name: 07_setup
      parameters:
        - name: escala
          default: "1"
        - name: reset
          default: "false"
      tasks:
        - task_key: gerar_fatia
          environment_key: gerador
          python_wheel_task:
            package_name: modelbricks_gerador
            entry_point: gerar_fatia
            parameters:
              - "--artigo=07-star-schema"
              - "--escala={{job.parameters.escala}}"
              - "--reset={{job.parameters.reset}}"
              - "--sufixo-catalogo=${var.sufixo_catalogo}"
      # Sem cluster declarado: o job roda em compute serverless (o único do Free Edition).
      environments:
        - environment_key: gerador
          spec:
            environment_version: "6"
            dependencies:
              - ../../00-gerador/dist/*.whl
