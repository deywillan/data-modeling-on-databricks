# Bundle único da série "Um caminho para implementação da Arquitetura Medalhão".
#
# Sem host nem perfil fixos: use o perfil da sua CLI, por exemplo
#   databricks bundle deploy -p <seu-perfil>
#   databricks bundle run 00_setup -p <seu-perfil>
#
# A série constrói um único lakehouse, em ordem: o 00_setup (em 00-gerador/) grava as landings
# de todos os sistemas, e cada pasta de artigo declara em <pasta>/resources/ o pipeline que
# acrescenta a sua parte, lendo o que os artigos anteriores construíram. O gerador de dados
# vira um wheel construído no deploy.

bundle:
  name: data-modeling-on-databricks

include:
  - "*/resources/*.yml"

# A série tem três catálogos, um por camada: bronze_<ambiente>, silver_<ambiente> e
# gold_<ambiente>. O ambiente vem do target (abaixo): dev gera _dev e prod gera _prd.
variables:
  ambiente:
    description: Ambiente no fim do nome dos catálogos. Cada target define o seu valor.

artifacts:
  gerador:
    type: whl
    path: ./00-gerador
    build: uv build --wheel

targets:
  dev:
    mode: development
    default: true
    variables:
      ambiente: dev

  prod:
    mode: production
    variables:
      ambiente: prd
    # Sem host fixo: use o perfil da sua CLI. O modo production pede uma pasta de deploy explícita
    # (root_path), aqui a pasta do próprio usuário.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
