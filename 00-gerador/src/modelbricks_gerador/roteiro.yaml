# Roteiro do Grupo ModelBricks
#
# Única fonte de números do gerador: datas, volumes, taxas de defeitos, eventos e a carga.
# O código não tem constantes de volume ou taxa espalhadas. Alterar este arquivo altera os
# dados gerados; por isso, toda mudança incrementa `versao`.

versao: 16

# Seed base de todo o gerador. Os seeds de tabelas, sistemas e lotes derivam dele por hash
# estável (seed base, sistema, data simulada).
seed_base: 20240101

# Linha do tempo simulada.
datas:
  inicio: 2024-01-01          # primeiro dia da história gerada
  carga_inicial: 2025-12-31   # data simulada da carga inicial (o relógio começa aqui)

# Fuso fixo da sessão Spark, para que os arquivos não dependam da máquina que os gera.
fuso_horario: UTC

# Volumes na escala 1 (período 2024 a 2025). A `escala` multiplica linearmente.
volumes:
  pessoas: 20000
  empresas_pj: 1500
  veiculos: 3000
  veiculos_frota_propria: 400
  passagens_embarque_passagemhub: 600000
  passagens_solticket: 150000               # carga histórica do SolTicket: do início da história à véspera da aquisição
  fretes_rotacerta: 60000
  vendas_veiculos: 3000
  apolices: 8000
  # Entidades de apoio do mundo verdadeiro (sem número no Estudo de Caso; definidas aqui).
  rotas: 120
  bases: 30
  lojas: 15
  colaboradores: 1500
  ordens_servico_patio: 12000                    # oficina da ModelBricks Veículos (DMS)

# Parâmetros de comportamento do mundo verdadeiro e dos sistemas.
parametros:
  pessoas_em_mais_de_uma_empresa: 0.15
  eventos_por_frete: {minimo: 5, maximo: 8}
  telemetria_dias_carga_inicial: 90
  # Bilhetagem da Viação (Embarque): vendas e ciclo de vida das passagens.
  embarque:
    fracao_passagens: 0.6                        # o restante é vendido pelo PassagemHub
    canais: {guiche: 0.45, site: 0.55}           # pesos relativos
    horario_vendas: {minimo: 6, maximo: 22}      # vendas entre 06h e 22h
    antecedencia_compra_dias: {minimo: 0, maximo: 30}
    poltronas: 46
    estorno: 0.01                                # passagem excluída (operação D)
    cancelamento: 0.04                           # status cancelada (operação U)
    remarcacao: 0.05                             # nova data de viagem (operação U)
    adiamento_remarcacao_dias: {minimo: 1, maximo: 15}
  # Telemetria da holding (Rastro): eventos de GPS e telemetria dos veículos da frota própria,
  # entregues como muitos arquivos pequenos. Na carga inicial, só os últimos
  # `telemetria_dias_carga_inicial` dias, independentemente da escala. Eventos na
  # janela, na escala 1: frota × eventos por dia × dias (400 × 72 × 90 ≈ 2,6 milhões).
  rastro:
    arquivos_por_dia: 24                         # granularidade: o dia em janelas iguais (24 = uma por hora)
    lotes_de_veiculos: 1                         # arquivos por janela: a frota dividida em lotes
    intervalo_eventos_minutos: 15                # um evento por veículo a cada 15 min de operação
    horario_operacao: {minimo: 5, maximo: 23}    # veículos rodando entre 05h e 23h
    km_por_dia: {minimo: 300, maximo: 700}       # quilometragem diária de cada veículo
    velocidade_kmh: {minimo: 0, maximo: 110}
    limite_velocidade_kmh: 90                    # acima disso, alerta de excesso de velocidade
    frenagem_brusca: 0.01                        # fração de eventos com alerta de frenagem brusca
    consumo_combustivel_pct_dia: {minimo: 35, maximo: 70}   # o tanque é completado a cada madrugada
    temperatura_motor_c: {minimo: 80, maximo: 105}
    rpm: {minimo: 600, maximo: 2200}
    area_operacao:                               # retângulo (graus) que cobre as UFs de atuação
      latitude: {minimo: -30.0, maximo: -12.0}
      longitude: {minimo: -54.0, maximo: -38.0}
  # Marketplace parceiro da Viação (PassagemHub): eventos de venda entregues por API paginada.
  passagemhub:
    eventos_por_pagina: 100                      # tamanho da página da API
    canais: {app: 0.65, site: 0.35}              # pesos relativos
    horario_vendas: {minimo: 0, maximo: 24}      # o marketplace vende 24 h por dia
    antecedencia_compra_dias: {minimo: 0, maximo: 45}
    poltronas: 46
    cancelamento: 0.06                           # evento de cancelamento antes da viagem
    remarcacao: 0.03                             # evento de remarcação para data posterior
    adiamento_remarcacao_dias: {minimo: 1, maximo: 15}
    taxa_servico: 0.08                           # fração da tarifa cobrada pelo marketplace
    # Coluna nova `pagamento` (evento coluna_nova_passagemhub): forma e parcelas.
    formas_pagamento: {pix: 0.45, cartao_credito: 0.45, boleto: 0.10}
    parcelas_cartao: {minimo: 1, maximo: 6}
  # ERP corporativo (Núcleo): incremental por updated_at, com soft delete. Taxas "ao ano" são a
  # chance de cada registro sofrer a mudança num ano (sorteada dia a dia).
  nucleo:
    horario_implantacao: {minimo: 0, maximo: 6}  # carga da implantação no 1º dia, de madrugada
    horario_expediente: {minimo: 8, maximo: 18}  # lançamentos do dia a dia
    mudanca_cargo_ao_ano: 0.12                   # colaborador muda de cargo (histórico de cargo)
    fornecedores: 0.20                           # fração das empresas PJ que fornecem ao grupo
    fornecedores_na_implantacao: 0.70            # o restante é cadastrado ao longo da história
    atualizacao_fornecedor_ao_ano: 0.25          # troca de telefone do fornecedor
    exclusao_fornecedor_ao_ano: 0.05             # fornecedor excluído (soft delete)
    titulos_pagar: 24000                         # títulos a pagar em 2024 e 2025, na escala 1
    empresas_titulos: {mb: 0.15, mb_viacao: 0.40, mb_cargas: 0.35, mb_veiculos: 0.10}
    categorias_despesa: {combustivel: 0.35, pecas: 0.20, manutencao: 0.15, servicos: 0.15, aluguel: 0.05, outros: 0.10}
    valor_titulo: {minimo: 300, maximo: 60000}   # R$
    prazo_vencimento_dias: {minimo: 15, maximo: 60}
    dias_pagamento_apos_vencimento: {minimo: 0, maximo: 5}
    cancelamento_titulo: 0.03                    # título excluído antes do vencimento (soft delete)
    depreciacao_ao_ano: 0.10                     # veículos da frota própria (ativos), lançada no fim do mês
  # TMS da Cargas (RotaCerta): CDC de fretes. Cada frete percorre o ciclo abaixo em
  # `eventos_por_frete` mudanças de status (as etapas opcionais completam a quantidade),
  # uma por dia, com `dias_entre_eventos` de intervalo entre elas.
  rotacerta:
    horario_operacao: {minimo: 6, maximo: 22}    # aberturas e mudanças de status entre 06h e 22h
    dias_entre_eventos: {minimo: 1, maximo: 3}
    prazo_entrega_dias: {minimo: 4, maximo: 15}  # data prevista de entrega, contada da abertura
    peso_kg: {minimo: 300, maximo: 28000}
    frete_por_kg: 0.42                           # R$ por kg transportado
    ciclo:
      - {status: aberto}
      - {status: coleta_agendada, opcional: true}
      - {status: coletado}
      - {status: em_transito}
      - {status: em_transbordo, opcional: true}  # passagem por um centro de distribuição
      - {status: em_rota_de_entrega}
      - {status: entrega_frustrada, opcional: true}
      - {status: entregue}
  # DMS da ModelBricks Veículos (Pátio): vendas de veículos e oficina, entregues como
  # snapshot completo em CSV.
  patio:
    # Datas das fotos: cada período vale até `ate` (inclusive); o último, sem `ate`, vale
    # para sempre (inclusive no avancar_tempo). Frequências: diaria, semanal (com
    # `dia_semana`, 0 = segunda) ou mensal (último dia do mês).
    snapshots:
      periodos:
        - {ate: 2025-11-30, frequencia: mensal}
        - {ate: 2025-12-31, frequencia: diaria}
        - {frequencia: diaria}
    horario_operacao: {minimo: 8, maximo: 18}      # vendas e oficina entre 08h e 18h
    dias_em_estoque: {minimo: 10, maximo: 120}     # da entrada do veículo no pátio à venda
    # Atualizações cadastrais dos clientes (telefone, e-mail ou endereço), ao longo do tempo.
    mudancas_cadastro:
      maximo_por_cliente: 6
      intervalo_dias: {minimo: 120, maximo: 900}   # entre o cadastro e cada mudança seguinte
      pesos: {telefone: 0.4, email: 0.3, endereco: 0.3}
    ordens_servico:
      duracao_dias: {minimo: 0, maximo: 7}
      cancelamento: 0.03                           # a OS cancelada é excluída do DMS
      valor: {minimo: 250, maximo: 18000}
      tipos: [Revisão, Troca de óleo, Freios, Suspensão, Elétrica, Pneus, Motor, Funilaria]
    # Empresas do grupo que compram a frota própria: cadastradas como clientes do DMS.
    clientes_grupo:
      mb_viacao: ModelBricks Viação S.A.
      mb_cargas: ModelBricks Cargas S.A.
  # Sistema de apólices da ModelBricks Seguros (Apólice+): incremental por updated_at em CSV.
  # Segurados são os clientes da ModelBricks Seguros na participação do mundo verdadeiro. As
  # apólices avulsas (`volumes.apolices`, na escala 1, em 2024 e 2025) são emitidas na
  # proporção dos segurados já cadastrados; as vendidas junto com veículos vêm por cima.
  apolice:
    horario_expediente: {minimo: 8, maximo: 18}  # emissões e alterações do dia a dia
    atualizacao_segurado_ao_ano: 0.20            # troca de telefone do segurado
    vigencia_meses: 12
    ramos_pf: {vida: 0.40, residencial: 0.40, viagem: 0.20}
    ramos_pj: {empresarial: 0.50, responsabilidade_civil: 0.30, transporte: 0.20}
    importancia_segurada: {minimo: 20000, maximo: 2000000}   # R$, apólices avulsas
    taxa_premio: {minimo: 0.005, maximo: 0.03}   # prêmio anual / importância segurada
    seguro_na_venda: 0.60                        # vendas de veículo a segurados que levam o seguro
    taxa_premio_veiculo: {minimo: 0.02, maximo: 0.05}
    cancelamento: 0.08                           # apólice cancelada durante a vigência
  # Legados do Expresso Vale do Sol (SolTicket e SolFin): nada antes da aquisição; nela, a
  # carga histórica inteira chega de uma vez (uma foto completa); depois, uma foto por semana.
  # Os volumes dos legados contam a carga histórica (do início da história à véspera da
  # aquisição) e seguem no mesmo ritmo depois dela.
  legados:
    snapshots:
      desde: 2025-07-01                          # data da aquisição (eventos.aquisicao_expresso_vale_do_sol)
      periodos:
        - {ate: 2025-07-01, frequencia: diaria}  # a carga histórica, no dia da aquisição
        - {frequencia: semanal, dia_semana: 0}   # depois, toda segunda-feira
  # Bilhetagem legada do Expresso Vale do Sol (SolTicket).
  solticket:
    canais: {guiche: 0.75, telefone: 0.25}       # pesos relativos
    horario_vendas: {minimo: 6, maximo: 22}
    antecedencia_compra_dias: {minimo: 0, maximo: 20}
    poltronas: 42
    cancelamento: 0.05                           # passagem cancelada antes da viagem
  # ERP legado do Expresso Vale do Sol (SolFin): fornecedores e títulos a pagar.
  solfin:
    fornecedores: 0.03                           # fração das empresas PJ que fornecem ao Vale do Sol
    titulos_pagar: 5000                          # títulos na carga histórica, na escala 1
    horario_expediente: {minimo: 8, maximo: 18}
    categorias_despesa: {Combustível: 0.40, Manutenção: 0.20, Peças: 0.15, Pedágio: 0.10, Serviços: 0.10, Aluguel: 0.05}
    valor_titulo: {minimo: 200, maximo: 40000}   # R$
    prazo_vencimento_dias: {minimo: 10, maximo: 45}
    dias_pagamento_apos_vencimento: {minimo: 0, maximo: 10}

# Mundo verdadeiro: como as entidades mestres e a participação de cada uma nas empresas
# do grupo são geradas. Pesos são relativos (não precisam somar 1).
mundo:
  # Tamanho (antes de deduplicar) de cada pool do Faker pt_BR gerado no driver.
  tamanho_pools: 3000
  # Piso de instâncias por empresa nas populações distribuídas entre empresas (rotas, bases,
  # lojas e colaboradores): em escala pequena, nenhuma empresa fica sem rota, base, loja ou
  # colaborador (sem isto, a 0,01 a Viação ficava sem rotas e, portanto, sem passagens).
  minimo_por_empresa: 1
  # UFs em que o grupo atua: rotas, bases, lojas, pessoas e empresas usam municípios delas.
  ufs_atuacao: [ES, MG, RJ, SP, BA, GO, DF, PR, SC, RS]
  idade_pessoas: {minimo: 18, maximo: 85}
  abertura_empresas: {inicio: 1980-01-01, fim: 2023-12-31}
  admissao_colaboradores: {inicio: 2005-01-01, fim: 2025-12-31}
  ano_fabricacao_veiculos: {minimo: 2012, maximo: 2025}
  participacao:
    # Empresa em que cada pessoa é cliente (a principal); `pessoas_em_mais_de_uma_empresa`
    # (em `parametros`) define quantas são clientes também de uma segunda empresa.
    pessoas: {mb_viacao: 0.70, evs: 0.15, mb_seguros: 0.10, mb_veiculos: 0.05}
    empresas_pj: {mb_cargas: 0.70, mb_veiculos: 0.20, mb_seguros: 0.10}
    empresas_pj_em_mais_de_uma_empresa: 0.20
  # Vendas da ModelBricks Veículos: os veículos da frota própria vão para as empresas do
  # grupo (ônibus para a Viação, caminhões para a Cargas); os demais, para clientes.
  vendas_veiculos_para_pj: 0.70
  rotas:
    empresas: {mb_viacao: 0.80, evs: 0.20}
    distancia_km: {minimo: 60, maximo: 1200}
    tarifa_por_km: 0.32
  bases: {mb_viacao: 0.50, mb_cargas: 0.40, evs: 0.10}
  lojas: {mb_veiculos: 0.60, mb_seguros: 0.40}
  colaboradores: {mb: 0.10, mb_viacao: 0.50, mb_cargas: 0.30, mb_veiculos: 0.10}

# Catálogos de valores do mundo verdadeiro (texto, não números de volume).
catalogos:
  dominios_email: [gmail.com, hotmail.com, outlook.com, yahoo.com.br, uol.com.br, bol.com.br, terra.com.br]
  ddds: [11, 12, 13, 14, 15, 16, 17, 18, 19, 21, 22, 24, 27, 28, 31, 32, 33, 34, 35, 37, 38, 41, 42, 43, 44, 45, 46, 47, 48, 49, 51, 53, 54, 55, 61, 62, 64, 71, 73, 74, 75, 77]
  ramos_empresa: [Transportes, Logística, Comércio, Distribuidora, Indústria, Agropecuária, Construtora, Alimentos, Mineração, Atacadista]
  tipos_base: {mb_viacao: Garagem, mb_cargas: Centro de Distribuição, evs: Garagem Vale do Sol}
  nomes_loja: {mb_veiculos: ModelBricks Veículos, mb_seguros: ModelBricks Seguros}
  cargos:
    mb: [Analista Financeiro, Analista de Compras, Assistente Administrativo, Analista de RH]
    mb_viacao: [Motorista, Motorista, Motorista, Agente de Atendimento, Mecânico, Supervisor de Tráfego]
    mb_cargas: [Motorista, Motorista, Ajudante de Carga, Conferente, Mecânico, Analista de Logística]
    mb_veiculos: [Vendedor, Mecânico, Consultor de Serviços, Gerente de Loja]
  # Modelos de ônibus e caminhões vendidos pela concessionária, com faixa de preço (R$).
  modelos_veiculos:
    - {marca: Mercedes-Benz, modelo: O 500 RSD, tipo: onibus, preco_minimo: 850000, preco_maximo: 1100000}
    - {marca: Mercedes-Benz, modelo: OF 1721, tipo: onibus, preco_minimo: 520000, preco_maximo: 640000}
    - {marca: Volvo, modelo: B450R, tipo: onibus, preco_minimo: 1100000, preco_maximo: 1350000}
    - {marca: Scania, modelo: K 440, tipo: onibus, preco_minimo: 1000000, preco_maximo: 1250000}
    - {marca: Volkswagen, modelo: 17.230 OD, tipo: onibus, preco_minimo: 480000, preco_maximo: 600000}
    - {marca: Mercedes-Benz, modelo: Actros 2651, tipo: caminhao, preco_minimo: 900000, preco_maximo: 1150000}
    - {marca: Mercedes-Benz, modelo: Atego 2430, tipo: caminhao, preco_minimo: 520000, preco_maximo: 650000}
    - {marca: Volvo, modelo: FH 540, tipo: caminhao, preco_minimo: 950000, preco_maximo: 1200000}
    - {marca: Scania, modelo: R 450, tipo: caminhao, preco_minimo: 850000, preco_maximo: 1050000}
    - {marca: Volkswagen, modelo: Constellation 24.280, tipo: caminhao, preco_minimo: 450000, preco_maximo: 580000}
    - {marca: Iveco, modelo: S-Way 480, tipo: caminhao, preco_minimo: 800000, preco_maximo: 980000}
    - {marca: DAF, modelo: XF 530, tipo: caminhao, preco_minimo: 880000, preco_maximo: 1080000}

# Sistemas de origem: como cada um entrega os arquivos na landing.
sistemas:
  nucleo:      {nome: Núcleo,      empresa: mb,          entrega: incremental,             formato: parquet}
  rastro:      {nome: Rastro,      empresa: mb,          entrega: stream,                  formato: json_aninhado}
  embarque:    {nome: Embarque,    empresa: mb_viacao,   entrega: cdc,                     formato: json}
  passagemhub: {nome: PassagemHub, empresa: mb_viacao,   entrega: api,                     formato: json_aninhado}
  rotacerta:   {nome: RotaCerta,   empresa: mb_cargas,   entrega: cdc,                     formato: json}
  patio:       {nome: Pátio,       empresa: mb_veiculos, entrega: snapshot,                formato: csv}
  apolice:     {nome: Apólice+,    empresa: mb_seguros,  entrega: incremental,             formato: csv}
  solticket:   {nome: SolTicket,   empresa: evs,         entrega: historico_mais_snapshot, formato: csv_latin1}
  solfin:      {nome: SolFin,      empresa: evs,         entrega: historico_mais_snapshot, formato: csv_latin1}
  ibge:        {nome: IBGE,        empresa: publico,     entrega: referencia,              formato: csv}

# Eventos roteirizados da linha do tempo.
eventos:
  aquisicao_expresso_vale_do_sol:
    data: 2025-07-01
    sistemas: [solticket, solfin]
    descricao: Aquisição do Expresso Vale do Sol; a carga histórica dos legados chega de uma vez.
  coluna_nova_passagemhub:
    data: 2026-01-05
    sistemas: [passagemhub]
    descricao: Coluna nova no payload da API do PassagemHub (schema evolution).
  reajuste_tarifas_embarque:
    data: 2026-01-12
    sistemas: [embarque]
    descricao: Reajuste de tarifas em massa no Embarque (muitos updates de uma vez).
    parametros: {percentual: 0.085}              # todas as tarifas sobem 8,5%

# Catálogo de defeitos: taxa por sistema (fração de 0 a 1, ou `arquivo`/`coluna` quando o
# defeito atinge o arquivo ou a coluna inteira). Os defeitos de entrega (atraso e reentrega)
# dizem também quantos dias depois a linha chega.
defeitos:
  cpf_fora_do_padrao:
    descricao: CPF sem máscara, com máscara ou com zeros à esquerda perdidos.
    taxas: {solticket: 0.30, apolice: 0.05, passagemhub: 0.05}
  nome_abreviado_ou_com_erro:
    descricao: Nome abreviado ou com erro de digitação ("Mª", "Jose" vs. "José").
    taxas: {passagemhub: 0.10, solticket: 0.10}
  pessoa_duplicada_no_sistema:
    descricao: Mesma pessoa duplicada dentro do mesmo sistema.
    taxas: {solticket: 0.03}
  contato_nulo:
    descricao: E-mail ou telefone nulo.
    taxas: {passagemhub: 0.15, patio: 0.15}
  evento_atrasado:
    descricao: Evento fora de ordem ou atrasado (late-arriving).
    taxas: {rastro: 0.02, rotacerta: 0.02}
    atraso_dias: {minimo: 1, maximo: 3}          # a linha chega 1 a 3 dias depois do evento
  cdc_duplicado:
    descricao: Registro CDC duplicado (reentrega da mesma operação).
    taxas: {embarque: 0.01}
    atraso_dias: {minimo: 1, maximo: 2}          # a reentrega chega 1 a 2 dias depois da original
  fk_orfa:
    descricao: FK órfã (passagem com rota inexistente).
    taxas: {solticket: 0.005}
  municipio_fora_do_padrao:
    descricao: Código de município fora do padrão IBGE.
    taxas: {patio: 0.02, solticket: 0.02}
  encoding_latin1:
    descricao: Encoding latin1 e acento quebrado.
    taxas: {solticket: arquivo, solfin: arquivo}
  valor_monetario_texto:
    descricao: Valor monetário como texto com vírgula ("1.234,56").
    taxas: {apolice: coluna}

# Carga: o que o 00_setup grava. A série constrói um único lakehouse, então a Bronze recebe
# todos os sistemas de uma vez, com o catálogo de defeitos inteiro, e o Silver recebe o
# gabarito. A ordem da lista é a ordem de geração: o Rastro, o maior, vem cedo, para que a
# gravação dele na landing corra enquanto os sistemas seguintes são gerados.
carga:
  sistemas: [nucleo, rastro, embarque, passagemhub, rotacerta, patio, apolice, solticket, solfin, ibge]
