# Job avancar_tempo: avança o relógio simulado da série e grava nas landings os lotes dos dias
# seguintes, de todos os sistemas. Exige o 00_setup já executado. Depois dele, rode os pipelines
# dos artigos já construídos, na ordem da série, para que cada camada receba os lotes novos.
#
#   databricks bundle run avancar_tempo -p <seu-perfil> --params dias=1

resources:
  jobs:
    avancar_tempo:
      name: avancar_tempo
      parameters:
        - name: dias
          default: "1"
      tasks:
        - task_key: avancar_tempo
          environment_key: gerador
          python_wheel_task:
            package_name: modelbricks_gerador
            entry_point: avancar_tempo
            parameters:
              - "--dias={{job.parameters.dias}}"
              - "--ambiente=${var.ambiente}"
      # Sem cluster declarado: o job roda em compute serverless (o único do Free Edition).
      environments:
        - environment_key: gerador
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
