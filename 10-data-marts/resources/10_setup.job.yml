# Job de setup do artigo 10 (Data Marts): cria os catálogos a10_bronze_<amb>, a10_silver_<amb> e
# a10_gold_<amb> (o ambiente vem do target do bundle: dev → _dev, prod → _prd), com um schema por
# sistema da fatia e o Volume landing no Bronze,
# o schema gabarito no Silver e a carga inicial da fatia nas landings.
#
#   databricks bundle run 10_setup -p <seu-perfil>
#   databricks bundle run 10_setup -p <seu-perfil> --params escala=0.1,reset=true

resources:
  jobs:
    10_setup:
      name: 10_setup
      parameters:
        - name: escala
          default: "1"
        - name: reset
          default: "false"
      tasks:
        - task_key: gerar_fatia
          environment_key: gerador
          python_wheel_task:
            package_name: modelbricks_gerador
            entry_point: gerar_fatia
            parameters:
              - "--artigo=10-data-marts"
              - "--escala={{job.parameters.escala}}"
              - "--reset={{job.parameters.reset}}"
              - "--ambiente=${var.ambiente}"
      # Sem cluster declarado: o job roda em compute serverless (o único do Free Edition).
      environments:
        - environment_key: gerador
          spec:
            environment_version: "6"
            dependencies:
              - ../../00-gerador/dist/*.whl
