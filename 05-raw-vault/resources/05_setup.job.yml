# Job de setup do artigo 05 (Raw Vault): cria os catálogos a05_bronze_<amb>, a05_silver_<amb> e
# a05_gold_<amb> (o ambiente vem do target do bundle: dev → _dev, prod → _prd), com um schema por
# sistema da fatia e o Volume landing no Bronze,
# o schema gabarito no Silver e a carga inicial da fatia nas landings.
#
#   databricks bundle run 05_setup -p <seu-perfil>
#   databricks bundle run 05_setup -p <seu-perfil> --params escala=0.1,reset=true

resources:
  jobs:
    05_setup:
      name: 05_setup
      parameters:
        - name: escala
          default: "1"
        - name: reset
          default: "false"
      tasks:
        - task_key: gerar_fatia
          environment_key: gerador
          python_wheel_task:
            package_name: modelbricks_gerador
            entry_point: gerar_fatia
            parameters:
              - "--artigo=05-raw-vault"
              - "--escala={{job.parameters.escala}}"
              - "--reset={{job.parameters.reset}}"
              - "--ambiente=${var.ambiente}"
      # Sem cluster declarado: o job roda em compute serverless (o único do Free Edition).
      environments:
        - environment_key: gerador
          spec:
            environment_version: "6"
            dependencies:
              - ../../00-gerador/dist/*.whl
